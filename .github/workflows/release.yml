name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для публикации (по умолчанию v<версия из package.json>)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: resolve version and tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            case "$REF_NAME" in
              v*) TAG="$REF_NAME" ;;
              *)  TAG="v$VERSION" ;;
            esac
          fi
          case "$TAG" in
            v?*) ;;
            *)   echo "tag '$TAG' must look like vX.Y.Z" >&2; exit 1 ;;
          esac
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release title: $TAG"

      - name: install
        run: npm ci --ignore-scripts

      - name: unit tests
        run: npm test

      - name: syntax and info
        run: npm run check

      - name: eslint
        run: npm run lint

      - name: bundle self-test
        run: node Nulls.js --self-test

      - name: build zip and bundle
        run: python3 tools/package_release.py

      - name: stage artifacts
        run: |
          mkdir -p dist
          cp "../nulls-headless-client-${{ steps.meta.outputs.version }}.zip" dist/
          cp "../nulls-headless-client-${{ steps.meta.outputs.version }}.zip.sha256" dist/
          cp Nulls.js dist/
          cp Nulls.js.sha256 dist/
          (cd dist && sha256sum -c ./*.sha256)
          ls -l dist

      - name: build release notes
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          version = json.loads(pathlib.Path('package.json').read_text())['version']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          heading = re.compile(rf'^##\s+\[?v?{re.escape(version)}\]?.*$', re.M)
          match = heading.search(text)
          body = ''
          if match:
              rest = text[match.end():]
              nxt = re.search(r'^##\s+', rest, re.M)
              body = (rest[:nxt.start()] if nxt else rest).strip()
          if not body:
              log = subprocess.check_output(
                  ['git', 'log', '--pretty=- %s (%h)', '-20'], text=True
              ).strip()
              body = '### Изменения\n\n' + log
          pathlib.Path('release-notes.md').write_text(
              f'# v{version}\n\n{body}\n', encoding='utf-8'
          )
          print(f'release notes for v{version}: {len(body)} chars')
          PY

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, updating notes and assets"
            gh release edit "$TAG" --notes-file release-notes.md $PRERELEASE
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes-file release-notes.md \
              $PRERELEASE
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
